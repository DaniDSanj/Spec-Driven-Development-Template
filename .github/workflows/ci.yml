name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Mínimo privilegio: el GITHUB_TOKEN de este workflow solo puede leer el repo. Si un paso futuro
# necesita escribir (comentar en la PR, publicar un paquete), se concede en ese job, no aquí.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA completo (un tag se puede mover; un SHA no). Dependabot las actualiza.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0             # gitleaks escanea todo el historial, no solo el último commit
          persist-credentials: false # el token no se queda en .git/config al alcance de los pasos siguientes
      # Escaneo de secretos: va ANTES del gate porque un secreto se puede commitear desde el primer
      # commit, haya o no proyecto Python. Binario oficial fijado por versión y verificado por
      # checksum (no gitleaks-action, que exige licencia en cuentas de organización). Usa la misma
      # .gitleaks.toml que .githooks/pre-commit. Para actualizar: cambiar las dos variables, tomando
      # el hash de gitleaks_<versión>_checksums.txt del release.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          config_args=()
          if [ -f .gitleaks.toml ]; then config_args=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose "${config_args[@]}" .
      # Gate: hasta que el proyecto no tiene pyproject.toml Y src/, no hay nada que comprobar y los
      # pasos de abajo fallarían por ausencia de entorno o de rutas, no por un problema real. El job
      # se ejecuta igualmente y reporta el check `quality` en verde, que es lo que exige la branch
      # protection de dev y main desde el primer commit del repo.
      - name: Check project is initialized
        id: check
        run: echo "exists=$(test -f pyproject.toml && test -d src && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.check.outputs.exists == 'true'
      - run: uv sync
        if: steps.check.outputs.exists == 'true'
      - run: uv run ruff check src/
        if: steps.check.outputs.exists == 'true'
      - run: uv run ruff format --check src/
        if: steps.check.outputs.exists == 'true'
      - run: uv run ty check
        if: steps.check.outputs.exists == 'true'
      - run: uv run pytest -q
        if: steps.check.outputs.exists == 'true'
      # CVEs conocidas en las dependencias de ejecución (uv.lock, sin el grupo dev). Bloquea la PR:
      # las Dependabot alerts solo avisan. --frozen exige que uv.lock exista y esté al día.
      - name: Dependency audit (pip-audit)
        if: steps.check.outputs.exists == 'true'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
