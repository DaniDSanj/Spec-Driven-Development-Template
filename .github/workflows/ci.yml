name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Gate: hasta que el proyecto no tiene pyproject.toml Y src/, no hay nada que comprobar y los
      # pasos de abajo fallarían por ausencia de entorno o de rutas, no por un problema real. El job
      # se ejecuta igualmente y reporta el check `quality` en verde, que es lo que exige la branch
      # protection de dev y main desde el primer commit del repo.
      - name: Check project is initialized
        id: check
        run: echo "exists=$(test -f pyproject.toml && test -d src && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.exists == 'true'
      - run: uv sync
        if: steps.check.outputs.exists == 'true'
      - run: uv run ruff check src/
        if: steps.check.outputs.exists == 'true'
      - run: uv run ruff format --check src/
        if: steps.check.outputs.exists == 'true'
      - run: uv run ty check
        if: steps.check.outputs.exists == 'true'
      - run: uv run pytest -q
        if: steps.check.outputs.exists == 'true'
